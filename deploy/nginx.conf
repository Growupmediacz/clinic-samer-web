# clinic-samer.cz – statický web (Astro, build.format 'directory': /kontakt → kontakt/index.html).
# HTTPS a certifikáty řeší Coolify (Traefik) před tímto kontejnerem.

map $uri $cs_redirect {
    default "";
    ~^/cz/?$                              /;
    ~^/de/datenschutz/?$                  /en/privacy;
    ~^/(it|ar)/privacy/?$                 /en/privacy;
    ~^/(de|it|ar)/cookies/?$              /en/cookies;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/security-headers.conf;

    if ($cs_redirect) { return 301 $cs_redirect; }

    # odstranění koncového lomítka (kanonické URL jsou bez něj)
    rewrite ^/(.+)/$ /$1 permanent;

    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
}
