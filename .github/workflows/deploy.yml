# Každý push do main: kontrola, build a náhled pro klienta na GitHub Pages
# https://growupmediacz.github.io/clinic-samer-web/ – noindex, bez Google Analytics (PREVIEW=1).
# Finální web na clinic-samer.cz se nasazuje zvlášť na VPS (deploy/README.md).
name: Náhled na GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          PREVIEW: '1'
          BASE_PATH: /${{ github.event.repository.name }}
      - name: Náhled nesmí jít do vyhledávačů
        run: |
          grep -q "Disallow: /$" dist/robots.txt
      - run: touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Produkční build pro Hostinger (clinic-samer.cz): hotový web se uloží do větve `hostinger`,
  # kterou si Hostinger (hPanel → Git, automatické nasazení přes webhook) stáhne do public_html.
  hostinger:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Produkce musí jít do vyhledávačů a mít .htaccess
        run: |
          grep -q "Allow: /" dist/robots.txt
          test -f dist/.htaccess
          test -f dist/_astro/.htaccess
      - name: Uložit build do větve hostinger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b hostinger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Produkční build ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" hostinger
